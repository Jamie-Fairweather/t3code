# Fork-only release: builds the Windows x64 installer from this fork's main and
# publishes it as a GitHub release, which installed copies auto-update from (the
# build points its updater at GITHUB_REPOSITORY). The version is the desktop
# package version from upstream main plus "-jamie.<run number>", so every build
# sorts above the last one and the updater offers it. Unsigned.
name: Jamie release (Windows x64)

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a build still in flight.
concurrency:
  group: jamie-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    if: github.repository != 'pingdotgg/t3code'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      # Full history and tags (without file contents) so the release notes
      # can list the commits since the previous build.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Same setup as windows-tests.yml: setup-vp's own cache is Linux-shaped.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: jamie-release-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: jamie-release-packages-v1-

      - name: Install
        shell: bash
        run: vp install

      - name: Add Rust target
        shell: bash
        run: rustup target add x86_64-pc-windows-msvc

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "require('./apps/desktop/package.json').version")"
          version="${base%%-*}-jamie.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      # T3 Connect's public client config, as baked into the official desktop
      # app (release.yml reads it from T3's production environment). Relay
      # tracing is left out so fork builds send nothing to T3's telemetry.
      - name: Build installer
        shell: bash
        env:
          T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
          T3CODE_CLERK_JWT_TEMPLATE: t3-relay
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
          T3CODE_RELAY_URL: https://relay.t3.codes
        run: >-
          vp run dist:desktop:artifact
          --platform win --target nsis --arch x64
          --build-version "${{ steps.version.outputs.version }}"
          --verbose

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*.exe release/*.blockmap release/latest.yml)
          if [[ ! -f release/latest.yml || ${#assets[@]} -lt 3 ]]; then
            echo "Missing installer or update manifest in release/:" >&2
            ls -la release >&2
            exit 1
          fi
          # Notes list the commits since the previous fork build, grouped by
          # their conventional-commit type ("feat(web): ..." -> New features).
          prev="$(git describe --tags --abbrev=0 --match 'v*-jamie.*' HEAD 2>/dev/null || true)"
          range="${prev:+$prev..}HEAD"
          features=() fixes=() other=()
          while IFS=$'\t' read -r sha subject; do
            if [[ "$subject" =~ ^([a-z]+)(\(([^\)]*)\))?!?:[[:space:]]*(.+)$ ]]; then
              type="${BASH_REMATCH[1]}" scope="${BASH_REMATCH[3]}" text="${BASH_REMATCH[4]}"
            else
              type="" scope="" text="$subject"
            fi
            line="- ${text^}${scope:+ ($scope)} ([\`$sha\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha))"
            case "$type" in
              feat) features+=("$line") ;;
              fix|perf) fixes+=("$line") ;;
              *) other+=("$line") ;;
            esac
          done < <(git log --no-merges --format='%h%x09%s' "$range" | head -n 200)
          section() {
            local title="$1"; shift
            (( $# )) || return 0
            printf '## %s\n\n' "$title"
            printf '%s\n' "$@"
            echo
          }
          {
            section "New features" "${features[@]}"
            section "Bug fixes" "${fixes[@]}"
            section "Other changes" "${other[@]}"
            if (( ${#features[@]} + ${#fixes[@]} + ${#other[@]} == 0 )); then
              echo "No new commits since ${prev:-the last build}."
              echo
            fi
            if [[ -n "$prev" ]]; then
              echo "**Full changes:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...v$VERSION"
              echo
            fi
            echo "Windows x64 build. Unsigned: Windows may warn on first install (More info, then Run anyway). Installed copies update themselves from these releases."
          } > release-notes.md
          cat release-notes.md
          gh release create "v$VERSION" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "T3 Code $VERSION" \
            --notes-file release-notes.md \
            --latest

      # Keep the newest few; installed copies only ever need the latest.
      - name: Prune old releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E -- '-jamie\.[0-9]+$' \
            | sort -t. -k4,4nr \
            | tail -n +6 \
            | while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
